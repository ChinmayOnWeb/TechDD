notes = """IPO 24 Jun 2021 on Nasdaq at $36.00; acquired by IBM for $31.00/share
cash, announced 2025-12-08, completed 2026-03-17. FYE December.

INCLUDED BY EXPLICIT DEPARTURE FROM THE FROZEN ATTRIBUTION RULE, 2026-08-17, at
the principal investigator's direction. The rule (docs/decision-repo-attribution.md)
excludes Confluent because Apache Kafka's authorship is only 21.8% Confluent
with 65.6% unattributable -- Confluent leads among identifiable employers, so it
passes the letter of the plurality test, but a 21.8% share means the index
largely measures the Kafka community rather than Confluent's engineering.

That reasoning has NOT been retracted and the exclusion is NOT reversed. This
firm is a documented robustness arm: the six-firm result stays primary, the
seven-firm result is reported alongside it, and both are reported whichever way
they come out. See the "Confluent" section of decision-repo-attribution.md for
the record of who decided what and when.

Interpret its index accordingly. For every other firm the health measure is a
proxy for the firm's own engineering; for this one it is closer to a measure of
a foundation community the firm participates in. If the seven-firm result
differs from the six-firm result, measurement error in this regressor is the
first explanation to reach for, not the last."""
